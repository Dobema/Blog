spring:
  application:
    name: blog-backend
  datasource:
    url: jdbc:h2:file:./data/blogdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  sql:
    init:
      mode: never

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    org.hibernate.SQL: info
