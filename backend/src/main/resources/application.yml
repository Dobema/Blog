spring:
  application:
    name: blog-backend
  datasource:
    url: ${BLOG_DB_URL:jdbc:h2:file:./data/blogdb}
    driver-class-name: org.h2.Driver
    username: ${BLOG_DB_USERNAME:sa}
    password: ${BLOG_DB_PASSWORD:}
  h2:
    console:
      enabled: ${BLOG_H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  sql:
    init:
      mode: never

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${BLOG_SECURE_COOKIE:false}
  error:
    include-message: never

logging:
  level:
    org.hibernate.SQL: info
